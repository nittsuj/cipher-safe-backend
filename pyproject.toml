[project]
name = "cipher-safe-backend"
version = "0.1.0"
description = "Django + DRF backend that encrypts personal data and files with AES, DES and RC4."
readme = "README.md"
authors = [
    { name = "nittsuj", email = "justinvalentino88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg2-binary>=2.9.13",
    "pycryptodome>=4.0.0",
]

# This is a Django application, not an importable library: there is no package
# to build or install, so tell uv to only manage the environment.
[tool.uv]
package = false
