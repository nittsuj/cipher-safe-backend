services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    # Prebuilt by CI on every merge to main; `docker compose up --build` builds it locally instead.
    image: ghcr.io/nittsuj/cipher-safe-backend:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database is the `db` service.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Live code reload while developing; the virtualenv lives in /opt/venv.
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media:
